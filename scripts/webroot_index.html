<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>box4 设置</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 14px 40px;
    font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #0b0b0c; color: #ededf0;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 19px; font-weight: 600; margin: 6px 0 16px; letter-spacing: .5px; }
  .card { background: #17171a; border: 1px solid #26262b; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 14px; }
  .row span:first-child { color: #9a9aa2; }
  .k { color: #ededf0; font-variant-numeric: tabular-nums; }
  .ok { color: #4ade80; } .bad { color: #f87171; }
  input[type=text] {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #33333a;
    background: #0f0f11; color: #ededf0; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: #4b4b55; }
  button {
    border: 0; border-radius: 10px; padding: 11px 14px; font-size: 14px; font-weight: 600;
    background: #2a2a30; color: #ededf0; cursor: pointer;
  }
  button:active { opacity: .75; }
  .primary { background: #3b82f6; color: #fff; width: 100%; margin-top: 10px; padding: 13px; font-size: 15px; }
  .btns { display: flex; gap: 10px; margin-top: 10px; }
  .btns button { flex: 1; }
  .sw { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #222226; }
  .sw:last-child { border-bottom: 0; }
  .toggle {
    width: 50px; height: 29px; border-radius: 15px; background: #33333a; position: relative;
    transition: background .18s; flex: 0 0 auto; border: 0; padding: 0;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px;
    border-radius: 50%; background: #8d8d96; transition: all .18s;
  }
  .toggle.on { background: #1f6feb; }
  .toggle.on::after { left: 24px; background: #fff; }
  .tip { color: #7c7c85; font-size: 12.5px; line-height: 1.6; margin-top: 8px; }
  .msg { font-size: 13px; color: #4ade80; margin-top: 10px; white-space: pre-wrap; word-break: break-all; }
  .msg.err { color: #f87171; }
  a { color: #6aa9ff; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>box4 设置</h1>

  <div class="card">
    <div class="row"><span>运行状态</span><span class="k" id="state">…</span></div>
    <div class="row"><span>内核 PID</span><span class="k" id="pid">…</span></div>
    <div class="row"><span>节点数</span><span class="k" id="nodes">…</span></div>
    <div class="row"><span>节点面板</span><a href="http://127.0.0.1:9090/ui" target="_blank">9090/ui ›</a></div>
    <div class="btns">
      <button onclick="act('on')">开启</button>
      <button onclick="act('off')">彻底关闭</button>
      <button onclick="load()">刷新</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="padding-bottom:2px"><span>订阅链接</span></div>
    <input type="text" id="sub" placeholder="https://…  粘贴机场的 Clash 订阅链接" spellcheck="false">
    <button class="primary" onclick="saveSub()">保存并应用</button>
    <div class="msg" id="msg"></div>
    <div class="tip">保存后会重写配置里的代理订阅地址、清缓存、重启内核，几秒后节点数会更新。链接里带 &amp; 之类符号也没问题。</div>
  </div>

  <div class="card">
    <div class="row" style="padding-bottom:6px"><span>哪些流量走代理</span></div>
    <div class="sw"><span>手机流量（移动数据）</span><button class="toggle" id="t-mobile" onclick="tog('mobile')"></button></div>
    <div class="sw"><span>WiFi</span><button class="toggle" id="t-wifi" onclick="tog('wifi')"></button></div>
    <div class="sw"><span>热点（给连热点的设备）</span><button class="toggle" id="t-hotspot" onclick="tog('hotspot')"></button></div>
    <div class="sw"><span>USB 共享</span><button class="toggle" id="t-usb" onclick="tog('usb')"></button></div>
    <div class="tip">默认四项全开。切换后会自动重启转发规则。</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function api(act, body) {
  const opts = body !== undefined
    ? { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' } }
    : { method: 'GET' };
  const r = await fetch('/cgi-bin/api?act=' + act, opts);
  return r.json();
}

function setState(s, pid, nodes) {
  const map = { on: ['运行中', 'ok'], off: ['已关闭', 'bad'], pause: ['已暂停', ''] };
  const [txt, cls] = map[s] || [s || '未知', ''];
  $('state').textContent = txt;
  $('state').className = 'k ' + cls;
  $('pid').textContent = pid || '—';
  $('nodes').textContent = nodes ? nodes + ' 个' : '0 个';
}

function paintIface(d) {
  ['mobile','wifi','hotspot','usb'].forEach(k => {
    const el = $('t-' + k);
    if (el) el.classList.toggle('on', String(d[k]) === '1');
  });
}

async function load() {
  const d = await api('status');
  setState(d.state, d.pid, d.nodes);
  if (d.sub) $('sub').value = d.sub;
  paintIface(d);
}

async function saveSub() {
  const url = $('sub').value.trim();
  if (!url) { show('先填链接', true); return; }
  show('正在保存…');
  const d = await api('sub', url);
  if (d.ok) {
    show('已保存，节点 ' + (d.nodes || 0) + ' 个');
    load();
  } else {
    show(d.msg || '失败', true);
  }
}

async function act(a) {
  show('处理中…');
  const d = await api(a);
  show(a === 'on' ? '已开启' : '已关闭');
  load();
}

async function tog(k) {
  const el = $('t-' + k);
  const next = el.classList.contains('on') ? 0 : 1;
  el.classList.toggle('on', next === 1);
  await api('iface&name=' + k + '&value=' + next);
  show(k + (next ? ' 已开启代理' : ' 已关闭代理'));
  load();
}

function show(t, err) {
  $('msg').textContent = t;
  $('msg').className = 'msg' + (err ? ' err' : '');
}

load();
</script>
</body>
</html>
